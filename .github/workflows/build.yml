name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/woden.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/woden.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secret set: using a one-off debug key, so updates will need a reinstall."
          fi

      # The runner image already includes the Android SDK.
      - name: Build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surface compile errors as annotations, readable without opening the log.
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | sed 's/^/::error::/' || true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Hlid.apk

      # Play bundle: same key (the Play upload key), Play package id. Kept off the public release.
      - name: Build the Play bundle
        if: env.SIGNING_KEYSTORE_PATH != ''
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:bundleRelease -PplayId=app.gethlid --no-daemon 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab Hlid-play.aab

      - name: Keep the Play bundle
        if: env.SIGNING_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Hlid-play-${{ github.run_number }}
          path: Hlid-play.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hlid ${{ github.run_number }}
          make_latest: true
          files: Hlid.apk
