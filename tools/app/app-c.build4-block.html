<!-- ===== Build 4 fixes (13 Nov, 21:30, Tony's phone feedback). Applies to the framed prototype and the APK. ===== -->
<style>
/* picked option: 3px ink edge (was 2px), drawn inside so the pill keeps its size */
.opt[aria-pressed="true"],.chip[aria-pressed="true"]{box-shadow:none!important}  /* 14 Nov: no picked edge at all (Tony) */
/* notes ("Google Maps would open here", "Saved to Photos") sit in the middle of the screen on a dimmed page,
   not as a black pill over the black buttons */
.toast{top:50%!important;bottom:auto!important;transform:translate(-50%,-50%)!important;background:#FFFFFF!important;color:#1A1A1A!important;
  font:500 16px/1.35 "Inter",sans-serif!important;padding:24px 32px!important;border-radius:28px!important;white-space:normal!important;
  text-align:center;width:max-content;max-width:280px;box-shadow:0 0 0 2000px rgba(26,26,26,.4)}

.w4-grow{flex:1 1 auto!important;min-height:0!important;height:auto!important}
.w4-grow > svg{width:100%!important;height:100%!important;display:block}
</style>
<script>
(function(){
  var view=document.getElementById("view");
  function scr(id){ return view.querySelector('.scr[data-id="'+id+'"] > div'); }
  function firstBtn(col){ return col.querySelector(":scope > button"); }
  function spacer(col){ var s=null; col.querySelectorAll(":scope > div").forEach(function(d){ if(d.style.flex==="1 1 0%"||d.style.flex==="1") s=d; }); return s; }
  /* Today 1 to 4 and You're here: the words sit 40px above the buttons; the extra space goes under the map */
  /* You're here: the map grows to fill down to the words (no white band under it) */
  (function(){ var root=scr("carpark"); if(!root) return; var m=root.querySelector(":scope > svg"); if(!m) return;
    m.style.flex="1 1 auto"; m.style.minHeight="0"; m.setAttribute("height","100%"); m.setAttribute("preserveAspectRatio","xMidYMid slice");
    var col=m.nextElementSibling; if(col){ col.style.flex="none"; var sp=spacer(col); if(sp) sp.remove(); var b=firstBtn(col); if(b) b.style.marginTop="28px"; } })();
  ["today-1","today-2","today-3","today-4"].forEach(function(id){ var root=scr(id); if(!root) return;
    var col=root.querySelector(":scope > div[style*='flex-direction: column']"); if(!col) return;
    var sp=spacer(col), b=firstBtn(col); if(!sp||!b) return;
    col.insertBefore(sp,col.firstChild); b.style.marginTop="28px"; });          /* 12px column gap + 28 = 40 */
  /* End of walk: the picture grows, caption 16px under it, 40px to Drive home */
  (function(){ var root=scr("done"); if(!root) return; var pic=root.children[0], col=root.children[1];
    pic.classList.add("w4-grow"); root.style.paddingTop="48px";   /* same 48px top as every other screen (was 56) */ var sp=spacer(col); if(sp) sp.remove(); col.style.flex="none";
    var b=firstBtn(col); if(b) b.style.marginTop="28px"; })();
  /* Find a pub: the map grows, 40px from the drive line to Drive there */
  (function(){ var root=scr("pub"); if(!root) return; var map=root.querySelector("#pubmap"); if(!map) return;
    map.parentNode.classList.add("w4-grow"); map.parentNode.style.background="#F0F0F0"; map.setAttribute("preserveAspectRatio","xMidYMid meet");
    var sp=spacer(root); if(sp) sp.remove(); var b=firstBtn(root); if(b) b.style.marginTop="40px"; })();
  /* A walk on its own: the picture grows, 40px from its line to Download */
  (function(){ var d=view.querySelector(".detail"); if(!d) return; var big=d.querySelector(".big"); big.classList.add("w4-grow"); big.style.width="auto";
    d.querySelectorAll(":scope > div").forEach(function(x){ if(x.style.flex==="1 1 0%"||x.style.flex==="1") x.remove(); });
    var dl=d.querySelector(".dl"); dl.style.marginTop="40px"; })();
})();
</script>
<!-- ===== Test walks, build 8 (14 Nov): Cannon Hill Common, Morden Park, Ranmore Common. Loops from OSM foot ways only
     (tools/walkdata/build8.py), map style B (tokens.json), one off-path buzz, elevation profile. Data is filled in by app/gen_app.py. ===== -->
<script type="application/json" id="w8walks">/*WALKS8*/</script>
<script type="application/json" id="w8tok">/*TOKENS*/</script>
<script>
/* APK only; in a browser add ?test to try it with taps as GPS (arrow keys turn you). */
(function(){
  var N=window.WodenNative, SIM=!N&&/[?&]test/.test(location.search);
  if(!N&&!SIM) return;
  var ALL=JSON.parse(document.getElementById("w8walks").textContent).walks, TK=JSON.parse(document.getElementById("w8tok").textContent);
  var M=TK.map, GD=TK.guidance, INK=TK.ink, WHITE=TK.white, LAND=M.land, WALKED=M.walked, NS="http://www.w3.org/2000/svg";
  var view=document.getElementById("view");
  var wi=0, D, LOOP, CUM, LEN, BASE, LOOPD, START, st;
  function m2ll(x,y){ return [D.lat0+y/D.ky, D.lon0+x/D.kx]; }
  function ll2m(lat,lon){ return [(lon-D.lon0)*D.kx,(lat-D.lat0)*D.ky]; }
  function nb(s){ return s.replace(/ (km|m|min)\b/g," $1"); }
  function dist(m){ return m>=1000? (m/1000).toFixed(1)+" km" : (Math.max(10,Math.round(m/10)*10))+" m"; }
  function d(lines,close){ var s=""; lines.forEach(function(l){ if(!l||l.length<2) return; s+="M"+l.map(function(p){ return p[0]+" "+(-p[1]); }).join("L")+(close?"Z":""); }); return s; }

  /* ---------- one walk's map, built in metres (x east, y south on screen) ---------- */
  function load(i){
    wi=i; D=ALL[i]; LOOP=D.loop; CUM=[0];
    for(var k=1;k<LOOP.length;k++) CUM.push(CUM[k-1]+Math.hypot(LOOP[k][0]-LOOP[k-1][0],LOOP[k][1]-LOOP[k-1][1]));
    LEN=CUM[CUM.length-1];
    var F=D.f, R=D.relief, b=R.box;
    BASE='<image href="'+R.uri+'" x="'+b[0]+'" y="'+(-b[3])+'" width="'+(b[2]-b[0])+'" height="'+(b[3]-b[1])+'" preserveAspectRatio="none"/>'+
      '<path d="'+d(D.con.c,0)+'" fill="none" stroke="'+M.contour+'" stroke-width="'+M.contour_w+'" vector-effect="non-scaling-stroke"/>'+
      '<path d="'+d(D.con.i,0)+'" fill="none" stroke="'+M.index+'" stroke-width="'+M.index_w+'" vector-effect="non-scaling-stroke"/>'+
      '<path d="'+d(F.wood,1)+'" fill="'+INK+'" fill-opacity="'+M.wood_opacity+'"/>'+
      '<path d="'+d(F.bld,1)+'" fill="'+INK+'" fill-opacity="'+M.building_opacity+'"/>'+
      '<path d="'+d(F.water,1)+'" fill="'+M.water+'"/>'+
      '<path d="'+d(F.road,0)+'" fill="none" stroke="'+M.road+'" stroke-width="'+M.road_w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
      '<path class="fp" d="'+d(F.path,0)+'" fill="none" stroke="'+M.path+'" stroke-linecap="butt" stroke-linejoin="round"/>';   /* dashes set per zoom in frame() */
    LOOPD=d([LOOP],0);
    START='<circle cx="'+LOOP[0][0]+'" cy="'+(-LOOP[0][1])+'" r="8" fill="'+INK+'" stroke="'+WHITE+'" stroke-width="3" vector-effect="non-scaling-stroke" class="tstart"/>';
    st={me:null,acc:null,head:null,perm:(st?st.perm:null),prog:0,walking:false,t0:0,trace:[],arrived:false,back:false,file:"",zoom:(st?st.zoom:null),offSince:0,buzzed:false,off:false};
    view.querySelectorAll('.scr[data-id^="t-"] .tmap').forEach(function(s){ delete s.dataset.built; s.innerHTML=""; });
    var t=el("t-today"); if(t){ t.querySelector("h1").textContent=D.name;
      t.querySelector(".tsub").textContent=nb((LEN/1000).toFixed(1)+" km walk. Test walk "+(i+1)+" of "+ALL.length+".");
      t.querySelector(".tmap").setAttribute("aria-label","The walk loop round "+D.name); }
  }
  function routeLayers(id){ return '<path class="'+id+'-ahead" d="'+LOOPD+'" fill="none" stroke="'+INK+'" stroke-width="'+M.route_w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
    '<path class="'+id+'-done" d="" fill="none" stroke="'+WALKED+'" stroke-width="'+M.route_w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'; }
  var ARROW='<path d="M0 -20 L16 20 L0 12 L-16 20 Z" fill="'+INK+'" stroke="'+WHITE+'" stroke-width="3" stroke-linejoin="round"/>';
  var DOT='<circle r="9" fill="'+INK+'" stroke="'+WHITE+'" stroke-width="3"/>';

  /* ---------- screens ---------- */
  var BACK='<svg class="ic" width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true"><path fill="currentColor" d="m274-450 227 227q9 9 9 21t-9 21q-9 9-21 9t-21-9L181-459q-5-5-7-10t-2-11q0-6 2-11t7-10l278-278q9-9 21-9t21 9q9 9 9 21t-9 21L274-510h496q13 0 21.5 8.5T800-480q0 13-8.5 21.5T770-450H274Z"></path></svg>';
  var BTN='width: 100%; height: 56px; border: 0; border-radius: 999px; background: '+INK+'; color: #FFFFFF; font-size: 18px';
  var TBTN='width: 100%; height: 48px; border: 0; background: transparent; color: '+INK+'; font-size: 18px';
  var COL='padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 12px; flex: none';
  var H1='margin: 0; font-size: 32px';
  var P='margin: 0; font-size: 16px; line-height: 1.5';
  var ROOT='width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Inter, sans-serif; color: '+INK+'; display: flex; flex-direction: column; position: relative; overflow: hidden';
  var CARDS=view.querySelector('.scr[data-id="today-1"] [data-go="walks"]').outerHTML;
  function sec(id,html){ var s=document.createElement("section"); s.className="scr"; s.dataset.id=id; s.dataset.t="1"; s.innerHTML=html; view.insertBefore(s,document.getElementById("sheet")); return s; }
  function el(id){ return view.querySelector('.scr[data-id="'+id+'"]'); }
  /* Today, test walk: the loop drawn like the Today line art, no drive */
  sec("t-today",'<div style="'+ROOT+'"><div class="cbar"><span class="sp"></span>'+CARDS+'</div>'+
    '<svg class="tmap" style="flex:1 1 auto;min-height:0;margin-top:96px" width="390" height="100%" role="img" aria-label=""></svg>'+
    '<div style="'+COL+'; padding-top: 24px"><h1 style="'+H1+'; font-size: 44px; text-wrap: balance"></h1>'+
    '<p style="'+P+'; text-wrap: pretty" class="tsub"></p>'+
    '<button type="button" data-t="there" style="'+BTN+'; margin-top: 28px">Walk there</button>'+
    '<button type="button" data-t="another" style="'+TBTN+'">Another walk</button></div></div>');
  /* Getting to the start: north up, you and the start, distance live. Arrives by GPS. */
  sec("t-start",'<div style="'+ROOT+'"><button type="button" class="tback" data-t="home" aria-label="Return to today" style="position: absolute; top: 48px; left: 12px; z-index: 2; width: 48px; height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">'+BACK+'</button>'+
    '<svg class="tmap" style="flex:1 1 auto;min-height:0;background:'+LAND+'" width="390" height="100%" role="img" aria-label="Map to the start of the walk, north up"></svg>'+
    '<div style="'+COL+'"><h1 style="'+H1+'" class="th">Head to the start</h1><p style="'+P+'" class="tl">Finding you…</p>'+
    '<button type="button" data-t="go" style="'+BTN+'; margin-top: 28px">Start walk</button></div></div>');
  /* Walking: heading-up, you fixed low in the middle, km to go, height profile with you on it */
  sec("t-walk",'<div style="'+ROOT+'; background: '+LAND+'"><svg class="tmap tilt" style="position:absolute;inset:0" width="390" height="100%" role="img" aria-label="Map of the path ahead, turned so the way you face is up"></svg><div class="offb" role="status" aria-live="assertive">Off the path. Head back to the line.</div>'+
    '<div class="tpanel" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 24px 32px; background: #FFFFFF; display: flex; flex-direction: column; gap: 16px">'+
    '<p style="'+P+'; text-wrap: pretty" class="lab tl"></p><svg class="prof" width="342" height="56" viewBox="0 0 342 56" role="img" aria-label=""></svg><button type="button" data-t="end" style="'+BTN+'">End walk</button></div></div>');
  /* End: your trace over the route */
  sec("t-done",'<div style="'+ROOT+'; padding: 48px 0 32px"><div style="margin: 0 24px; border-radius: 24px; overflow: hidden; flex: 1 1 auto; min-height: 0; background: '+LAND+'">'+
    '<svg class="tmap" width="342" height="100%" style="display:block;width:100%;height:100%" role="img" aria-label="Your GPS trace over the walk"></svg></div>'+
    '<div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 12px; flex: none"><p style="'+P+'" class="tl"></p>'+
    '<button type="button" data-t="home" style="'+BTN+'; margin-top: 28px">Done</button></div></div>');

  var cur=null;
  function showT(id){ cur=id; view.querySelectorAll(".scr").forEach(function(s){ s.classList.toggle("on",s.dataset.id===id); });
    if(N){ N.keepAwake(id==="t-start"||id==="t-walk"); }
    if(id==="t-start"||id==="t-walk"){ gpsOn(); if(N) N.startCompass(); } else { if(N) N.stopCompass(); if(!st.walking) gpsOff(); }
    draw(); }
  function gpsOn(){ if(N) N.startGps(); }
  function gpsOff(){ if(N) N.stopGps(); }
  function toPrototype(){ cur=null; document.getElementById("returning").click(); }
  window.wodenTestBack=function(){ if(!cur) return false;
    if(cur==="t-walk") return true;                     /* no accidental exit mid-walk: End walk ends it */
    if(cur==="t-today") return false;
    showT("t-today"); return true; };
  window.wodenPermHook=function(ok){ st.perm=ok; draw(); };
  view.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    var s=b.closest(".scr");
    if(s&&s.dataset.t){ if(b.dataset.go) { cur=null; return; } e.stopPropagation(); act(b.dataset.t); return; }
    if(s&&s.dataset.id==="today-4"&&b.textContent.trim()==="Another walk"){ e.stopPropagation(); load(0); showT("t-today"); }
  },true);
  function act(a){
    if(a==="another"){ if(wi<ALL.length-1){ load(wi+1); showT("t-today"); } else toPrototype(); }   /* the test walks in turn, then the prototype */
    else if(a==="there"){ showT("t-start"); }
    else if(a==="home"){ showT("t-today"); }
    else if(a==="go"){ startWalk(); }
    else if(a==="end"){ endWalk(); }
  }
  function startWalk(){ st.walking=true; st.t0=Date.now(); st.trace=[]; st.back=false; st.offSince=0; st.buzzed=false; st.off=false;
    st.prog = st.me && Math.hypot(st.me[0]-LOOP[0][0],st.me[1]-LOOP[0][1])>60 ? project(st.me,0,LEN).p : 0;
    if(N) N.startTrace(D.name); showT("t-walk"); }
  function endWalk(){ st.walking=false; st.file=N? N.endTrace() : "Downloads/Hlid/hlid-test.gpx";
    if(N) N.stopCompass(); showT("t-done"); }

  /* ---------- position along the route ---------- */
  function project(p,from,to){ var best={dd:1e9,p:0};
    for(var i=1;i<LOOP.length;i++){ if(CUM[i]<from||CUM[i-1]>to) continue;
      var a=LOOP[i-1], b=LOOP[i], vx=b[0]-a[0], vy=b[1]-a[1], L2=vx*vx+vy*vy||1;
      var t=Math.max(0,Math.min(1,((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L2)), qx=a[0]+t*vx, qy=a[1]+t*vy, dd=Math.hypot(p[0]-qx,p[1]-qy);
      if(dd<best.dd) best={dd:dd,p:CUM[i-1]+t*Math.sqrt(L2)}; }
    return best; }
  function pointAt(s){ for(var i=1;i<LOOP.length;i++) if(CUM[i]>=s){ var t=(s-CUM[i-1])/((CUM[i]-CUM[i-1])||1); return [LOOP[i-1][0]+t*(LOOP[i][0]-LOOP[i-1][0]),LOOP[i-1][1]+t*(LOOP[i][1]-LOOP[i-1][1])]; } return LOOP[LOOP.length-1]; }
  function walkedLine(s){ var pts=[]; for(var i=0;i<LOOP.length&&CUM[i]<s;i++) pts.push(LOOP[i]); if(s>0) pts.push(pointAt(s)); return pts.length>1? d([pts],0) : ""; }
  function bearingAt(s){ var a=pointAt(Math.max(0,s-5)), b=pointAt(Math.min(LEN,s+25)); return (Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI+360)%360; }

  window.wodenFix=function(lat,lon,acc,t){ st.me=ll2m(lat,lon); st.acc=acc; var now=t||Date.now();
    if(st.walking){ st.trace.push(st.me);
      var r=project(st.me,st.prog-40,st.prog+250); if(r.dd<50&&r.p>st.prog) st.prog=r.p;
      /* off the path (build 8, Tony 14 Nov): more than about 150 m from the route for about 2 minutes = one gentle buzz, then quiet.
         It re-arms only once you are back near the line (within half that distance). */
      var g=project(st.me,0,LEN);
      if(g.dd>GD.off_path_m){ if(!st.offSince) st.offSince=now;
        if(!st.buzzed&&now-st.offSince>=GD.off_path_s*1000){ st.buzzed=true; st.off=true; if(N) N.vibrate(400); } }
      else if(g.dd<GD.off_path_m/2){ st.offSince=0; st.buzzed=false; st.off=false; }
      if(!st.back&&st.prog>LEN-60&&Math.hypot(st.me[0]-LOOP[0][0],st.me[1]-LOOP[0][1])<GD.back_m){ st.back=true; if(N) N.vibrate(300); } }
    else if(cur==="t-start"){ var near=Math.hypot(st.me[0]-LOOP[0][0],st.me[1]-LOOP[0][1])<=GD.arrive_m;
      if(near&&!st.arrived){ st.arrived=true; if(N) N.vibrate(300); } }
    draw(); };
  window.wodenHeading=function(h){ st.head=h; if(cur==="t-walk"||cur==="t-start") draw(); };

  /* ---------- height profile ---------- */
  function climbFrom(k){ var h=D.prof.h, c=0; for(var j=Math.max(0,k);j<h.length-1;j++) if(h[j+1]>h[j]) c+=h[j+1]-h[j]; return c; }
  function profile(svg,s){
    var h=D.prof.h, W=342, H=56, lo=Math.min.apply(null,h), hi=Math.max.apply(null,h), span=Math.max(hi-lo,40);   /* flat walks stay flat */
    var X=function(j){ return j/(h.length-1)*W; }, Y=function(v){ return H-4-(v-lo)/span*(H-12); };
    var k=Math.min(h.length-1,Math.round(s/D.prof.step));
    var area="M0 "+H; for(var j=0;j<h.length;j++) area+=" L"+X(j).toFixed(1)+" "+Y(h[j]).toFixed(1); area+=" L"+W+" "+H+" Z";
    var done="", ahead=""; for(j=0;j<=k;j++) done+=(j?" L":"M")+X(j).toFixed(1)+" "+Y(h[j]).toFixed(1);
    for(j=k;j<h.length;j++) ahead+=(j>k?" L":"M")+X(j).toFixed(1)+" "+Y(h[j]).toFixed(1);
    svg.innerHTML='<path d="'+area+'" fill="'+M.profile_fill+'"/><path d="'+done+'" fill="none" stroke="'+WALKED+'" stroke-width="'+M.profile_line_w+'" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<path d="'+ahead+'" fill="none" stroke="'+INK+'" stroke-width="'+M.profile_line_w+'" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(h[k]).toFixed(1)+'" r="6" fill="'+INK+'" stroke="'+WHITE+'" stroke-width="2"/>';
    svg.setAttribute("aria-label","Height along the walk, "+Math.round(lo)+" to "+Math.round(hi)+" m, you are marked on it");
    return Math.round(climbFrom(k)/10)*10; }

  /* ---------- drawing ---------- */
  function svgSize(svg){ var w=svg.clientWidth||390, h=svg.clientHeight||600, k=w/390; return [390, Math.max(100,h/k)]; }
  function frame(svg,cx,cy,scale,rot,ax,ay){
    var sz=svgSize(svg); svg.setAttribute("viewBox","0 0 "+sz[0]+" "+sz[1]);
    if(!svg.dataset.built){ svg.innerHTML='<rect class="bg" width="100%" height="100%" fill="'+LAND+'"/><g class="w"><g class="m">'+BASE+'<path class="trail" d="" fill="none" stroke="'+M.trail+'" stroke-width="'+M.trail_w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+routeLayers("r")+START+'</g></g><g class="you"></g>'; svg.dataset.built=1; }
    svg.querySelector(".bg").setAttribute("width",sz[0]+40); svg.querySelector(".bg").setAttribute("height",sz[1]+40);
    var X=(ax==null?sz[0]/2:ax), Y=(ay==null?sz[1]/2:ay);
    svg.querySelector(".tstart").setAttribute("r",8/scale);   /* start dot stays 8px whatever the zoom */
    var fp=svg.querySelector(".fp"); if(fp&&fp.dataset.s!=String(scale)){ fp.dataset.s=scale;   /* footpath dashes stay 6 4 at 2.2px on screen */
      fp.setAttribute("stroke-width",(M.path_w/scale).toFixed(3)); fp.setAttribute("stroke-dasharray",M.path_dash.map(function(v){ return (v/scale).toFixed(3); }).join(" ")); }
    svg.querySelector(".w").setAttribute("transform","translate("+X+" "+Y+") rotate("+rot+") scale("+scale+") translate("+(-cx)+" "+(cy)+")");
    return {w:sz[0],h:sz[1],X:X,Y:Y}; }
  function fitBox(pts,w,h,pad){ var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pts.forEach(function(p){ x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]); });
    var sc=Math.min((w-2*pad)/Math.max(x1-x0,1),(h-2*pad)/Math.max(y1-y0,1)); return {cx:(x0+x1)/2,cy:(y0+y1)/2,sc:Math.min(sc,1.4)}; }
  function youMark(svg,f,x,y,rot){ var g=svg.querySelector(".you");
    if(!st.me){ g.innerHTML=""; return; }
    g.innerHTML=(st.head==null? DOT : ARROW); g.setAttribute("transform","translate("+x+" "+y+") rotate("+(st.head==null?0:rot)+")"); }
  function trailD(){ var TR=st.trace; return TR.length>1? "M"+TR.map(function(q){ return q[0].toFixed(1)+" "+(-q[1]).toFixed(1); }).join(" L") : ""; }
  function draw(){
    if(!cur) return;
    var s=el(cur), svg=s.querySelector(".tmap");
    if(cur==="t-today"){ var sz=svgSize(svg); svg.setAttribute("viewBox","0 0 "+sz[0]+" "+sz[1]);
      var fb=fitBox(LOOP,sz[0],sz[1],64), tr="translate("+sz[0]/2+" "+sz[1]/2+") scale("+fb.sc+") translate("+(-fb.cx)+" "+(fb.cy)+")";
      svg.innerHTML='<g transform="'+tr+'"><path d="'+LOOPD+'" fill="none" stroke="'+INK+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
        '<circle cx="'+LOOP[0][0]+'" cy="'+(-LOOP[0][1])+'" r="7" fill="#FFFFFF" stroke="'+INK+'" stroke-width="3" vector-effect="non-scaling-stroke"/></g>'; return; }
    if(cur==="t-start"){
      var pts=LOOP.slice(); var far=st.me? Math.hypot(st.me[0]-LOOP[0][0],st.me[1]-LOOP[0][1]) : null;
      if(st.me&&far<2500) pts.push(st.me);
      var sz2=svgSize(svg), fb2=fitBox(pts,sz2[0],sz2[1],48), f=frame(svg,fb2.cx,fb2.cy,fb2.sc,0);
      svg.querySelector(".r-done").setAttribute("d","");
      if(st.me) youMark(svg,f,f.X+(st.me[0]-fb2.cx)*fb2.sc,f.Y-(st.me[1]-fb2.cy)*fb2.sc,st.head||0); else youMark(svg,f);
      var h=s.querySelector(".th"), l=s.querySelector(".tl");
      if(st.perm===false){ h.textContent="Head to the start"; l.textContent="Location is off. Allow it in Settings to test the walk."; }
      else if(!st.me){ h.textContent="Head to the start"; l.textContent="Finding you…"; }
      else if(far<=GD.arrive_m||st.arrived){ h.textContent="You’re here"; l.textContent=nb((LEN/1000).toFixed(1)+" km loop, about "+Math.round(LEN/1000*18/5)*5+" min."); }
      else { h.textContent="Head to the start"; l.textContent=dist(far)+" to the start."; }
      return; }
    if(cur==="t-walk"){
      var pos=st.me||pointAt(st.prog), rot=-(st.head!=null? st.head : bearingAt(st.prog)), z=st.zoom||0.85;
      svg.classList.toggle("flat", z>1.6);   /* tilt stays subtle, and goes flat when you zoom right in */
      var sz3=svgSize(svg), panel=s.querySelector(".tpanel").getBoundingClientRect().height/((svg.getBoundingClientRect().width||390)/390);
      var f3=frame(svg,pos[0],pos[1],z,rot,sz3[0]/2,(sz3[1]-panel)*(z>1.6?0.62:0.78));
      svg.querySelector(".r-done").setAttribute("d",walkedLine(st.prog));
      svg.querySelector(".trail").setAttribute("d",trailD());   /* where you've actually been: faint solid grey, thrown away after the walk */
      var g=svg.querySelector(".you"); g.innerHTML=ARROW; g.setAttribute("transform","translate("+f3.X+" "+f3.Y+")");
      var left=Math.max(0,LEN-st.prog), climb=profile(s.querySelector(".prof"),st.prog);
      s.querySelector(".tl").textContent= st.back? "You’re back" : (!st.me? "Finding you…" : nb(dist(left)+" to go. "+(climb>=10? "About "+climb+" m still to climb." : "No more climbing.")));
      s.querySelector(".offb").classList.toggle("on", !!st.off&&!st.back);
      return; }
    if(cur==="t-done"){
      var sz4=svgSize(svg); svg.setAttribute("viewBox","0 0 "+sz4[0]+" "+sz4[1]);
      var all=LOOP.concat(st.trace), fb4=fitBox(all,sz4[0],sz4[1],40);
      var tr4="translate("+sz4[0]/2+" "+sz4[1]/2+") scale("+fb4.sc+") translate("+(-fb4.cx)+" "+(fb4.cy)+")";
      svg.innerHTML='<rect width="'+(sz4[0]+40)+'" height="'+(sz4[1]+40)+'" fill="'+LAND+'"/><g transform="'+tr4+'">'+BASE+
        '<path d="'+LOOPD+'" fill="none" stroke="'+WALKED+'" stroke-width="'+M.route_w+'" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+
        (st.trace.length>1? '<path d="'+d([st.trace],0)+'" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '')+'</g>';
      var fp=svg.querySelector(".fp"); fp.setAttribute("stroke-width",(M.path_w/fb4.sc).toFixed(3)); fp.setAttribute("stroke-dasharray",M.path_dash.map(function(v){ return (v/fb4.sc).toFixed(3); }).join(" "));
      var walked=0; for(var k=1;k<st.trace.length;k++) walked+=Math.hypot(st.trace[k][0]-st.trace[k-1][0],st.trace[k][1]-st.trace[k-1][1]);
      var mins=Math.round((Date.now()-st.t0)/60000), day=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"});
      s.querySelector(".tl").innerHTML=nb(D.name+", "+day+". "+(walked/1000).toFixed(2)+" km in "+mins+" min.")+"<br>"+
        (st.file? "GPS trace saved to "+st.file+"." : "No GPS trace was recorded.");
      return; }
  }
  addEventListener("resize",function(){ draw(); });

  /* browser try-out: tap the map to be there; arrow keys turn you */
  if(SIM){ view.addEventListener("click",function(e){ var svg=e.target.closest(".tmap"); if(!svg||!(cur==="t-start"||cur==="t-walk")) return;
      var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
      var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY;
      var q=p.matrixTransform(svg.querySelector(".m").getScreenCTM().inverse());
      var ll=m2ll(q.x,-q.y); window.wodenFix(ll[0],ll[1],5,Date.now()); });
    addEventListener("keydown",function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ window.wodenHeading(((st.head||0)+(e.key==="ArrowLeft"?-15:15)+360)%360); } }); }

  window.wodenTest={get st(){ return st; },showT:showT,load:load,get LEN(){ return LEN; },get LOOP(){ return LOOP; },m2ll:function(x,y){ return m2ll(x,y); },redraw:function(){ draw(); }};
  load(0); showT("t-today");
})();
</script>

<script>
/* build 7: two-finger pinch on the walking map changes the zoom; the map keeps following you */
(function(){ var d0=0,z0=0;
  function dist(t){ return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY); }
  document.addEventListener("touchstart",function(e){ var m=e.target.closest&&e.target.closest('.scr[data-id="t-walk"]'); if(!m||e.touches.length!==2||!window.wodenTest) return; d0=dist(e.touches); z0=window.wodenTest.st.zoom||0.85; e.preventDefault(); },{passive:false});
  document.addEventListener("touchmove",function(e){ if(!d0||e.touches.length!==2||!window.wodenTest) return; var z=z0*dist(e.touches)/d0; window.wodenTest.st.zoom=Math.max(0.15,Math.min(3,z)); if(window.wodenTest.redraw) window.wodenTest.redraw(); e.preventDefault(); },{passive:false});
  document.addEventListener("touchend",function(e){ if(e.touches.length<2) d0=0; });
})();
</script>
